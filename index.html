<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코테 복습 노트</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --sub: #6b7280; --line: #e3e1da;
    --accent: #2f6f4f; --accent-ink: #ffffff; --warn: #b4532a; --code-bg: #f1efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --card: #212326; --ink: #e8e6e1; --sub: #9aa0a6; --line: #34373b;
            --accent: #5fae86; --accent-ink: #10231a; --warn: #e08a5e; --code-bg: #2a2d31; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.65 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  header h1 { font-size: 24px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--sub); font-size: 14px; }
  nav { display: flex; gap: 8px; margin: 24px 0 16px; flex-wrap: wrap; }
  nav button { border: 1px solid var(--line); background: transparent; color: var(--ink);
               padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 18px 20px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .meta { color: var(--sub); font-size: 13px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none;
         padding: 7px 13px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.warn { color: var(--warn); border-color: var(--warn); }
  .btn.quiet { color: var(--sub); }
  .btn:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 4px; }
  label small { font-weight: 400; color: var(--sub); }
  input, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
  textarea { min-height: 110px; resize: vertical; }
  textarea.code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-height: 170px; }
  .notice { font-size: 13px; color: var(--sub); border-left: 3px solid var(--line); padding-left: 10px; margin: 14px 0; }
  .error { color: var(--warn); font-size: 14px; margin-top: 10px; }
  .note { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 6px; font-size: 15px; overflow-wrap: anywhere; }
  .note h2, .note h3 { font-size: 16px; margin: 18px 0 6px; }
  .note pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
  .note code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
  .note pre code { background: none; padding: 0; }
  .note table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
  .note th, .note td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .note ul, .note ol { padding-left: 22px; margin: 6px 0; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px;
           border: 1px solid var(--line); color: var(--sub); margin-left: 6px; vertical-align: middle; }
  .badge.due { color: var(--warn); border-color: var(--warn); }
</style>
</head>
<body>
<main>
  <header>
    <h1>코테 복습 노트</h1>
    <p id="summary">불러오는 중…</p>
  </header>
  <nav role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">오늘 복습</button>
    <button role="tab" data-tab="all" aria-selected="false">전체 문제</button>
    <button role="tab" data-tab="add" aria-selected="false">틀린 문제 추가</button>
  </nav>

  <section id="today"></section>
  <section id="all" hidden></section>

  <section id="add" hidden>
    <form class="card" id="form">
      <label for="url">문제 링크</label>
      <input id="url" type="url" required placeholder="https://school.programmers.co.kr/learn/courses/30/lessons/...">
      <label for="title">문제 제목</label>
      <input id="title" required placeholder="예: 로또의 최고 순위와 최저 순위">
      <label for="problem_text">문제 설명 <small>— 노트를 만들 때만 읽고 저장하지 않습니다</small></label>
      <textarea id="problem_text" placeholder="문제 페이지의 설명과 제한 사항, 입출력 예를 붙여 넣으세요."></textarea>
      <label for="code">내가 제출한 코드</label>
      <textarea id="code" class="code" required spellcheck="false"></textarea>
      <label for="result">제출 결과 <small>— 예: 테스트 3, 7 실패 / 시간 초과 / 런타임 에러</small></label>
      <input id="result">
      <label for="memo">메모 <small>— 선택. 헷갈렸던 점이나 스스로 찾은 원인</small></label>
      <input id="memo">
      <p class="notice">연습 문제 전용입니다. 실제 시험이나 기업 코딩테스트 도중에는 사용하지 마세요.</p>
      <div class="row">
        <button class="btn primary" id="submit" type="submit">노트 만들기</button>
        <span id="status" class="meta" style="margin:0"></span>
      </div>
      <div id="form-error" class="error" role="alert"></div>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let state = { problems: [], today: "", model: "", intervals: [] };
const openNotes = new Set();

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/&lt;br\s*\/?&gt;/g, "<br>");
}

// 노트 표시에 필요한 만큼만 지원하는 작은 마크다운 변환기 (제목, 목록, 표, 코드 블록, 굵게)
function renderMarkdown(md) {
  const lines = md.replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0, list = null;
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      closeList();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      closeList();
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      let html = "<table><thead><tr>" + cells(line).map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        html += "<tr>" + cells(lines[i]).map((c) => "<td>" + c + "</td>").join("") + "</tr>";
        i++;
      }
      out.push(html + "</tbody></table>");
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); const lv = Math.min(h[1].length + 1, 4); out.push("<h" + lv + ">" + inline(h[2]) + "</h" + lv + ">"); i++; continue; }
    const li = line.match(/^\s*(?:([-*])|(\d+)[.)])\s+(.*)$/);
    if (li) {
      const kind = li[1] ? "ul" : "ol";
      if (list !== kind) { closeList(); out.push("<" + kind + ">"); list = kind; }
      out.push("<li>" + inline(li[3]) + "</li>");
      i++; continue;
    }
    if (!line.trim()) { closeList(); i++; continue; }
    closeList();
    out.push("<p>" + inline(line) + "</p>");
    i++;
  }
  closeList();
  return out.join("\n");
}

function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

function dueLabel(p) {
  if (p.graduated) return '<span class="badge">졸업</span>';
  if (p.is_due) return '<span class="badge due">오늘 복습</span>';
  return '<span class="badge">' + daysBetween(state.today, p.due_on) + "일 뒤</span>";
}

function card(p, reviewMode) {
  const open = openNotes.has(p.id);
  const stageText = p.graduated ? "모든 간격 통과" : (p.stage + 1) + "번째 복습 (" + state.intervals[p.stage] + "일 간격)";
  return '<article class="card">' +
    "<h2>" + esc(p.title) + dueLabel(p) + "</h2>" +
    '<div class="meta">' + esc(p.site) + " · 등록 " + p.created_on + " · " + stageText +
      " · 복습 " + p.review_count + "회, 그중 틀림 " + p.fail_count + "회</div>" +
    '<div class="row">' +
      '<a class="btn" href="' + esc(p.url) + '" target="_blank" rel="noopener">문제 풀러 가기</a>' +
      '<button class="btn" data-act="toggle" data-id="' + p.id + '">' + (open ? "노트 접기" : "노트 보기") + "</button>" +
      (reviewMode
        ? '<button class="btn primary" data-act="solved" data-id="' + p.id + '">다시 풀어서 맞음</button>' +
          '<button class="btn warn" data-act="failed" data-id="' + p.id + '">또 틀림</button>'
        : '<button class="btn quiet" data-act="delete" data-id="' + p.id + '">삭제</button>') +
    "</div>" +
    (open ? '<div class="note">' + renderMarkdown(p.note) + '<p class="meta">노트 작성 모델: ' + esc(p.model) + "</p></div>" : "") +
    "</article>";
}

function render() {
  const due = state.problems.filter((p) => p.is_due);
  $("summary").textContent = "오늘 " + state.today + " · 복습할 문제 " + due.length + "개 · 전체 " +
    state.problems.length + "개 · 노트 모델 " + state.model;
  $("today").innerHTML = due.length
    ? '<p class="notice">노트를 보기 전에 먼저 문제를 다시 풀어 보세요. 막히면 그때 노트를 여세요.</p>' + due.map((p) => card(p, true)).join("")
    : '<p class="empty">오늘 복습할 문제가 없습니다.</p>';
  $("all").innerHTML = state.problems.length
    ? state.problems.map((p) => card(p, false)).join("")
    : '<p class="empty">아직 등록한 문제가 없습니다. "틀린 문제 추가"에서 시작하세요.</p>';
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "요청에 실패했습니다.");
  return data;
}

async function load() { state = await api("/api/problems"); render(); }

function showTab(name) {
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
  for (const id of ["today", "all", "add"]) $(id).hidden = id !== name;
}

document.querySelector("nav").addEventListener("click", (e) => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); });

document.querySelector("main").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = Number(btn.dataset.id), act = btn.dataset.act;
  if (act === "toggle") { openNotes.has(id) ? openNotes.delete(id) : openNotes.add(id); render(); return; }
  if (act === "delete" && !confirm("이 문제와 노트를 삭제할까요? 되돌릴 수 없습니다.")) return;
  btn.disabled = true;
  try {
    if (act === "delete") await api("/api/delete", { id });
    else await api("/api/review", { id, outcome: act });
    await load();
  } catch (err) { alert(err.message); btn.disabled = false; }
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("form-error").textContent = "";
  $("submit").disabled = true;
  const started = Date.now();
  const timer = setInterval(() => { $("status").textContent = "노트를 만드는 중… " + Math.round((Date.now() - started) / 1000) + "초 (보통 20~60초)"; }, 500);
  try {
    const body = {};
    for (const id of ["url", "title", "problem_text", "code", "result", "memo"]) body[id] = $(id).value;
    const created = await api("/api/problems", body);
    $("form").reset();
    openNotes.add(created.id);
    await load();
    showTab("all");
  } catch (err) {
    $("form-error").textContent = err.message;
  } finally {
    clearInterval(timer);
    $("status").textContent = "";
    $("submit").disabled = false;
  }
});

load().catch((err) => { $("summary").textContent = "불러오지 못했습니다: " + err.message; });
</script>
</body>
</html>
